    gen:
      go:
        package: "thread"
        out: "internal/models/thread"

  - engine: "sqlite"
    queries: "internal/db/message.queries.sql"
    schema: "internal/db/message.schema.sql"
    gen:
      go:
        package: "message"
        out: "internal/models/message"
