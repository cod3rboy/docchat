name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: DocChat
  VERSION: ${{ github.ref_name }}

jobs:
  linux:
    name: Build Linux (AppImage, deb and rpm)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            imagemagick \
            wget \
            file

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Wails application
        run: make build-linux version=${{ github.ref_name }}

      - name: Generate App Icon
        run: |
          convert build/appicon.png \
            -resize 512x512 \
            build/${APP_NAME}-512.png

      - name: Copy .desktop file
        run: cp app.desktop build/app.desktop

      - name: Create dist directory
        run: mkdir -p dist

      - name: Preparing AppDir for AppImage
        shell: bash
        run: |
          APPDIR="dist/${APP_NAME}.AppDir"

          mkdir -p \
            "${APPDIR}/usr/bin" \
            "${APPDIR}/usr/share/applications" \
            "${APPDIR}/usr/share/icons/hicolor/512x512/apps"

          cp "build/bin/${APP_NAME}" \
            "${APPDIR}/usr/bin/${APP_NAME}"

          cp "build/${APP_NAME}-512.png" \
            "${APPDIR}/usr/share/icons/hicolor/512x512/apps/${APP_NAME}.png"

          cp build/app.desktop "${APPDIR}/usr/share/applications/${APP_NAME}.desktop"

          cp build/app.desktop  "${APPDIR}/${APP_NAME}.desktop"

          cp "build/${APP_NAME}-512.png" \
            "${APPDIR}/${APP_NAME}.png"

      - name: Download linuxdeploy
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy.AppImage

          chmod +x linuxdeploy.AppImage

      - name: Create AppImage
        shell: bash
        run: |
          ./linuxdeploy.AppImage \
            --appdir "dist/${APP_NAME}.AppDir" \
            --desktop-file "dist/${APP_NAME}.AppDir/usr/share/applications/${APP_NAME}.desktop" \
            --icon-file "dist/${APP_NAME}.AppDir/usr/share/icons/hicolor/512x512/apps/${APP_NAME}.png" \
            --output appimage

          mv "${APP_NAME}"-*.AppImage \
            "dist/${APP_NAME}-${VERSION}-linux-amd64.AppImage"

      - name: Setup NFPM
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          envsubst < nfpm.yaml > nfpm-config.yaml
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Create deb Package
        run: nfpm package --packager deb --target dist/ --config nfpm-config.yaml

      - name: Create rpm Package
        run: nfpm package --packager rpm --target dist/ --config nfpm-config.yaml

      - name: Verify artifacts
        run: |
          file dist/*.AppImage
          file dist/*.deb
          file dist/*.rpm
          chmod +x dist/*.AppImage
          chmod +x dist/*.deb
          chmod +x dist/*.rpm

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-appimage
          path: dist/*.AppImage

      - name: Upload deb Package
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-deb
          path: dist/*.deb

      - name: Upload rpm Package
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-rpm
          path: dist/*.rpm

  windows:
    name: Build Windows (Portable Executable)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Install Make
        shell: pwsh
        run: choco install make

      - name: Set build metadata
        shell: pwsh
        run: |
          $build = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          "APP_BUILD=$build" >> $env:GITHUB_ENV

      - name: Build Wails application
        shell: pwsh
        run: make build-windows version=${{ github.ref_name }} APP_BUILD="$env:APP_BUILD"

      - name: Rename executable
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")

          New-Item -ItemType Directory -Force dist | Out-Null

          Move-Item `
            "build/bin/${env:APP_NAME}.exe" `
            "dist/${env:APP_NAME}-${version}-windows-amd64.exe"

      - name: Verify executable
        shell: pwsh
        run: |
          Get-Item dist/*.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: dist/*.exe

  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - linux
      - windows

    steps:
      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64-appimage
          path: dist

      - name: Download Linux deb Package
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64-deb
          path: dist

      - name: Download Linux rpm Package
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64-rpm
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-amd64
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DocChat ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS
